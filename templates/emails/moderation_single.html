<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family:sans-serif;max-width:640px;margin:0 auto;">
  <h2>{{ article.edited_title }}</h2>
  {% if article.image_url %}<img src="{{ article.image_url }}" style="max-width:100%;" alt="">{% endif %}
  <p style="white-space:pre-line;">{{ article.edited_post_text }}</p>
  <p>
    <a href="{{ urls.publish }}" style="padding:8px 16px;background:#2e7d32;color:#fff;text-decoration:none;border-radius:4px;">Опубликовать</a>
    &nbsp;
    <a href="{{ urls.publish_urgent }}" style="padding:8px 16px;background:#ef6c00;color:#fff;text-decoration:none;border-radius:4px;">Опубликовать срочно</a>
    &nbsp;
    <a href="{{ urls.reject }}" style="padding:8px 16px;background:#c62828;color:#fff;text-decoration:none;border-radius:4px;">Отклонить</a>
  </p>
</body>
</html>
