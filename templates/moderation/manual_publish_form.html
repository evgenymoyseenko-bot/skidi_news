<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Срочная новость Клуба</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; margin-top: 4px; }
    textarea { min-height: 160px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-weight: normal; }
    .checkbox-row input { width: auto; }
    button { margin-top: 24px; padding: 10px 24px; font-size: 16px; background: #2e7d32; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .error { color: #c62828; font-weight: 600; }
    .hint { color: #666; font-size: 14px; margin-top: 4px; }
  </style>
</head>
<body>
  <h2>Срочная новость Клуба</h2>
  <p class="hint">Публикуется сразу в Telegram-канал и в ЛК, помечается как срочная.</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <label for="title">Заголовок</label>
    <input type="text" id="title" name="title" value="{{ title|default:'' }}" required>

    <label for="content">Текст</label>
    <textarea id="content" name="content" required>{{ content|default:'' }}</textarea>

    <label for="image">Фото (необязательно)</label>
    <input type="file" id="image" name="image" accept="image/*">

    <label class="checkbox-row">
      <input type="checkbox" name="skip_llm_formatting" value="1">
      Опубликовать как есть, без LLM-форматирования
    </label>

    <button type="submit">Опубликовать срочно</button>
  </form>
</body>
</html>
