# Деплой на news.skidiscoverer.ru (11.09.2026) — проверено реальным запуском на VPS
# (Debian 13, vps.skidi.club). Caddy добавлен как reverse-proxy с автоматическим HTTPS
# (Let's Encrypt) — этого не было в исходном скелете, docs/DEPLOYMENT.md явно указывал на
# отсутствие TLS как известный пробел, закрыт при первом реальном деплое.
#
# `bot` (chatbot, Этап 11 docs/CODER_INSTRUCTIONS.md) закомментирован — модуль ещё не
# реализован, `manage.py run_bot` не существует, сервис бы падал в restart-цикле.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gl_news
      POSTGRES_USER: gl_news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  beat:
    build: .
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media_data:/media:ro
    depends_on:
      - web
    restart: unless-stopped

  # bot:
  #   build: .
  #   command: python manage.py run_bot   # реализовать в модуле chatbot, см. docs/CHATBOT.md — Этап 11, не сделан
  #   env_file: .env
  #   depends_on:
  #     - db
  #   restart: unless-stopped

  # Опционально — мониторинг очереди Celery, см. docs/DEPLOYMENT.md.
  # flower:
  #   build: .
  #   command: celery -A config flower --port=5555
  #   env_file: .env
  #   depends_on:
  #     - redis
  #   ports:
  #     - "5555:5555"

volumes:
  db_data:
  caddy_data:
  caddy_config:
  media_data:
